[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=database
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
    -v
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    financial: Tests involving financial calculations

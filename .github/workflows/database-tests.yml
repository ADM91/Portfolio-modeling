name: Database Layer Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'database/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/database-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'database/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/database-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 database/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 database/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run unit tests
      run: |
        python -m pytest tests/test_database_access.py -v --tb=short -m "unit"
    
    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v --tb=short -m "integration"
    
    - name: Run financial calculation tests
      run: |
        python -m pytest tests/ -v --tb=short -m "financial"
    
    - name: Generate coverage report
      run: |
        python -m pytest tests/ --cov=database --cov-report=xml --cov-report=term-missing --cov-fail-under=75
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: database-tests
        name: codecov-umbrella
        fail_ci_if_error: false

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run performance tests
      run: |
        python -m pytest tests/ -v --tb=short -m "slow" --durations=10
    
    - name: Performance benchmark
      run: |
        python -c "
        import time
        from database.access_improved import DatabaseAccess
        from database.entities_improved import Base
        from sqlalchemy import create_engine
        
        # Simple performance benchmark
        engine = create_engine('sqlite:///:memory:')
        Base.metadata.create_all(engine)
        db = DatabaseAccess(engine)
        
        print('Database layer performance benchmark completed')
        "

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run security scan with bandit
      run: |
        bandit -r database/ -f json -o bandit-report.json || true
        bandit -r database/ -f txt
    
    - name: Check for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
